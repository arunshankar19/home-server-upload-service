services:
  upload-service:
    build:
      context: .
      secrets:
        - netrc
    ports:
      - 8001:${API_PORT:-8001}
    networks:
      - home-server-network
    environment:
      - API_VERSION=${API_VERSION}
      - API_PORT=${API_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB_NAME=${POSTGRES_DB_NAME}
      - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE}
      - POSTGRES_SEARCH_PATH=${POSTGRES_SEARCH_PATH}
      - OBSERVABILITY_ENABLED=${OBSERVABILITY_ENABLED}
      - TRACE_EXPOTER_URL=${TRACE_EXPOTER_URL}
      - MINIO_ACCESS_KEY_ID=${MINIO_ACCESS_KEY_ID}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY}
      - MINIO_ADDR=${MINIO_ADDR}
      - MINIO_DATA_BUCKET_NAME=${MINIO_DATA_BUCKET_NAME}
      - MINIO_PRESIGNED_URL_EXP_IN_MINUTES=${MINIO_PRESIGNED_URL_EXP_IN_MINUTES}
      - BATCH_SIZE=${BATCH_SIZE}
      - UPLOAD_EXPIRY_DURATION_IN_HOURS=${UPLOAD_EXPIRY_DURATION_IN_HOURS}
      - FILE_EXPLORER_HOST_NAME=${FILE_EXPLORER_HOST_NAME}
      - FILE_EXPLORER_PORT=${FILE_EXPLORER_PORT}

    depends_on:
      uploader-db:
        condition: service_healthy
      minio:
        condition: service_healthy

  upload-service-batch:
    build:
      context: .
      dockerfile: Dockerfile-batch
      secrets:
        - netrc
    networks:
      - home-server-network
    environment:
      - API_VERSION=${API_VERSION}
      - API_PORT=${API_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB_NAME=${POSTGRES_DB_NAME}
      - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE}
      - POSTGRES_SEARCH_PATH=${POSTGRES_SEARCH_PATH}
      - OBSERVABILITY_ENABLED=${OBSERVABILITY_ENABLED}
      - TRACE_EXPOTER_URL=${TRACE_EXPOTER_URL}
      - MINIO_ACCESS_KEY_ID=${MINIO_ACCESS_KEY_ID}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY}
      - MINIO_ADDR=${MINIO_ADDR}
      - MINIO_DATA_BUCKET_NAME=${MINIO_DATA_BUCKET_NAME}
      - MINIO_PRESIGNED_URL_EXP_IN_MINUTES=${MINIO_PRESIGNED_URL_EXP_IN_MINUTES}
      - BATCH_SIZE=${BATCH_SIZE}
      - UPLOAD_EXPIRY_DURATION_IN_HOURS=${UPLOAD_EXPIRY_DURATION_IN_HOURS}
      - FILE_EXPLORER_HOST_NAME=${FILE_EXPLORER_HOST_NAME}
      - FILE_EXPLORER_PORT=${FILE_EXPLORER_PORT}

    depends_on:
      uploader-db:
        condition: service_healthy
      minio:
        condition: service_healthy

  uploader-db:
    image: postgres:17
    ports:
      - 6001:5432
    networks:
      - home-server-network
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U ${POSTGRES_USER} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - home-server-network
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  migrate:
    image: migrate/migrate
    profiles: ["tools"]
    depends_on:
      uploader-db:
        condition: service_healthy
    volumes:
      - ./migrations/postgres:/migrations
    entrypoint: [ "migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB_NAME}?search_path=public&sslmode=disable" ]
    user: "${UID:-1000}:${GID:-1000}"
    networks:
      - home-server-network
  
networks:
  home-server-network:
    external: true

secrets:
  netrc:
    file: ./.netrc

volumes:
  minio_data:
  pgdata:
